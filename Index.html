<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>To-Do-List — Daily Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="background-effects">
  <div class="glow-orb orb-1"></div>
  <div class="glow-orb orb-2"></div>
</div>

<div class="app">
  <header class="topbar glass-panel">
    <div class="brand">
      <div class="brand-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="url(#gradient)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
          <defs>
            <linearGradient id="gradient" x1="0" y1="0" x2="24" y2="24">
              <stop offset="0%" stop-color="#8a2be2"/>
              <stop offset="100%" stop-color="#4169e1"/>
            </linearGradient>
          </defs>
        </svg>
      </div>
      <h1>To-Do-List</h1>
    </div>
    <div class="streak-display" id="streakDisplay">
      <span class="flame" id="flameIcon">🔥</span>
      <div class="streak-text">
        <span class="streak-number" id="streakCount">0</span>
        <span class="streak-label">day streak</span>
      </div>
    </div>
  </header>

  <main class="layout">
    <aside class="panel nav-sidebar glass-panel">
      <div class="tabs-container">
        <div class="tabs">
          <button class="tab-btn active" id="tabIncomplete">
            Incomplete
            <span class="tab-badge" id="incompleteBadge">0</span>
          </button>
          <button class="tab-btn" id="tabHistory">
            History
            <span class="tab-badge" id="historyBadge">0</span>
          </button>
          <div class="tab-indicator" id="tabIndicator"></div>
        </div>
      </div>
    </aside>

    <section class="panel task-panel glass-panel">
      <div class="date-nav">
        <button id="prevDay" class="nav-btn" aria-label="Previous day">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <div class="date-current">
          <button id="calendarBtn" class="calendar-btn" aria-label="Select Date">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
          </button>
          <input type="date" id="datePicker" min="2011-01-01" max="2050-12-31">
          <span id="dateReadable" class="date-readable"></span>
        </div>
        <button id="nextDay" class="nav-btn" aria-label="Next day">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
        </button>
        <button id="todayBtn" class="today-btn">Today</button>
      </div>

      <div class="progress-row">
        <div class="progress-bar-track">
          <div class="progress-bar-fill" id="progressFill"></div>
        </div>
        <span class="progress-label" id="progressLabel">0 / 0 done</span>
      </div>

      <form id="taskForm" class="add-task-form">
        <input type="text" id="taskInput" placeholder="Add a new task for this day..." autocomplete="off" required>
        <div class="form-controls">
          <button type="submit" class="add-btn" style="width: 100%; justify-content: center;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            Add Task
          </button>
        </div>
      </form>



      <ul id="taskList" class="task-list"></ul>

      <div id="emptyState" class="empty-state" hidden>
        <div class="empty-icon">✨</div>
        <p class="empty-text">Nothing here yet.</p>
        <p class="empty-sub">Your tasks will appear here.</p>
      </div>
    </section>

    <aside class="panel side-panel glass-panel">
      <div class="side-block">
        <h2>Journey Stats</h2>
        <p class="side-sub" id="streakSub">Complete every task in a day to build your streak.</p>
        <div class="streak-meta">
          <div class="meta-item glass-card">
            <span class="meta-value gradient-text" id="currentStreakVal">0</span>
            <span class="meta-label">Current Streak</span>
          </div>
          <div class="meta-item glass-card">
            <span class="meta-value gradient-text" id="bestStreakVal">0</span>
            <span class="meta-label">Best Streak</span>
          </div>
          <div class="meta-item glass-card">
            <span class="meta-value gradient-text" id="totalDoneVal">0</span>
            <span class="meta-label">Total Tasks</span>
          </div>
        </div>
      </div>

      <div class="side-block mt-auto">
        <h2>Badges</h2>
        <p class="side-sub">Unlock achievements on your journey.</p>
        <div class="badge-grid" id="badgeGrid"></div>
      </div>
    </aside>
  </main>

  <div id="toast" class="toast" hidden></div>
</div>

<script src="script.js"></script>
</body>
</html>
